# Usage:
# make up
# make compose otel-slim

services:
  otel-collector-slim:
    container_name: otel-collector-slim
    hostname: otel-collector-slim
    image: otel/opentelemetry-collector-contrib:0.113.0
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ../config/opentelemetry/otel-slim.yml:/etc/otel-collector-config.yaml:ro
      # Monta o filesystem do host (somente leitura) para o receiver hostmetrics
      # conseguir ler métricas reais do host, e não apenas do container
      - /proc:/hostfs/proc:ro
      - /sys:/hostfs/sys:ro
      - /:/hostfs:ro
    restart: unless-stopped
    environment:
      - OTELCOL_LOG_LEVEL=debug
      - HOST_LOCATION=${HOST_LOCATION:-NAO-ADICIONADO}  # Valor resolvido em runtime e usado no atributo host.location do collector.
      # Variáveis usadas pelos scrapers do hostmetrics para localizar os
      # arquivos reais do host dentro do container (via /hostfs)
      - HOST_PROC=/hostfs/proc
      - HOST_SYS=/hostfs/sys
      - HOST_ETC=/hostfs/etc
      - HOST_VAR=/hostfs/var
      - HOST_RUN=/hostfs/run
      - HOST_DEV=/hostfs/dev
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "8888:8888"   # Métricas do Collector
      - "8889:8889"   # Exporter Prometheus
      - "13133:13133" # Health Check
    depends_on:
      - lgtm
    networks:
      - opentelemetry

  lgtm:
    image: grafana/otel-lgtm:latest
    container_name: lgtm
    hostname: lgtm
    restart: unless-stopped
    ports:
      - "4000:3000" # Interface do Grafana
    # environment:
    #   # Desabilita o acesso anônimo com papel Admin que vem por padrão na imagem
    #   - GF_AUTH_ANONYMOUS_ENABLED=false
    #   - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
    #   - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?defina GRAFANA_ADMIN_PASSWORD no .env}
    networks:
      - opentelemetry

networks:
  opentelemetry:
    external: true