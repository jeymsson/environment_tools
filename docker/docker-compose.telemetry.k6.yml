# Usage:
# make up
# make compose k6

services:
  influxdb:
    image: influxdb:1.8
    networks:
      - k6
      - grafana
    ports:
      - 8086:8086
    environment:
      - INFLUXDB_DB=k6

  k6:
    image: grafana/k6:master
    container_name: k6
    entrypoint: ["sh", "-c", "k6 run /scripts/sample.js"]
    networks:
      - k6
    ports:
      - 6565:6565
    environment:
      - K6_OUT=influxdb=http://influxdb:8086/k6
    volumes:
      - ../config/k6/scripts:/scripts

networks:
  k6:
    driver: bridge
  grafana:
    driver: bridge
  opentelemetry:
    external: true
