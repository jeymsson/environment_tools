# Usage:
# make up
# make compose otel
# make compose otel prometheus
# make compose otel grafana
# make compose otel jaeger
# make compose otel prometheus grafana jaeger

services:
  otel-collector:
    container_name: otel-collector
    hostname: otel-collector
    image: otel/opentelemetry-collector-contrib:0.113.0
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ../config/opentelemetry/otel.yml:/etc/otel-collector-config.yaml
    restart: unless-stopped
    environment:
      - OTELCOL_LOG_LEVEL=debug
    ports:
      - "8888:8888"   # Prometheus metrics exposed by the collector
      - "8889:8889"   # Prometheus exporter metrics
      - "4317:4317"   # OTLP gRPC receiver
    #   - "9200:55679"  # zpages
      - "13133:13133" # health_check extension
    #   - "14250:14250" # jaeger receiverotel
    networks:
      - opentelemetry

networks:
  opentelemetry:
    external: true
