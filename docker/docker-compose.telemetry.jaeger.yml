# Usage:
# make up
# make compose jaeger

services:
  jaeger:
    image: jaegertracing/all-in-one:1.65.0
    container_name: jaeger
    ports:
      - 16686:16686
    networks:
      - opentelemetry

  jaeger-agent:
    image: jaegertracing/jaeger-agent:1.62.0
    container_name: jaeger-agent
    command: ['--reporter.grpc.host-port=otel-collector:14250']
    networks:
      - opentelemetry

networks:
  opentelemetry:
    external: true

